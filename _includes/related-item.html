<a class="sr-rel" data-kind="{{ include.kind }}" href="{{ include.post.url | relative_url }}"><span class="sr-rel-title">{{ include.post.title | escape }}</span><span class="sr-rel-date">{{ include.post.date | date: "%b %-d, %Y" }}</span><span class="sr-rel-excerpt">{{ include.post.excerpt | strip_html | strip_newlines | truncate: 140 }}</span></a>
