---
layout: default
---
{% assign tag_posts = site.tags[page.tag] %}
<article class="page-card">
  <h1 class="entry-title tax-title">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg>
    {{ page.tag }}
    <span class="tax-count">{{ tag_posts | size }}</span>
  </h1>
  <div class="list-section">
    {% for post in tag_posts %}
      {% include archive-row.html post=post %}
    {% endfor %}
  </div>
</article>
