title: "Red-Soc Blog"
description: "Security Research, Hacking, And Tech Notes."
url: "https://red-soc.github.io"
baseurl: ""
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page

